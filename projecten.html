<!DOCTYPE html> <!-- Hierdoor weet de browser dat het een HTML5 document is -->
<html lang="nl"> <!-- Inhoud van de pagina is in het Nederlands -->
<head> <!-- Hier komen de meta gegevens van de pagina -->
  <meta charset="UTF-8"> <!-- Tekens zoals letters en cijfers worden correct weergegeven -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- De pagina past zich aan aan het scherm van het apparaat -->
  <title>Projecten — Ferdous Uddin</title> <!-- De titel van de pagina die in het tabblad van de browser wordt weergegeven -->
  <link rel="stylesheet" href="css/base.css"> <!-- Link naar het CSS-bestand -->
 <link rel="stylesheet" href="css/layout.css">
 <link rel="stylesheet" href="css/projecten.css">
  <script src="js/projecten.js" defer></script>
</head>
<body> <!-- De inhoud van de pagina wordt hier weergegeven -->
  <header> <!-- De header van de pagina, bevat de naam en navigatiebalk -->
    <h1>Ferdous Uddin</h1> <!-- De naam van de auteur -->
    <nav> <!-- Navigatiebalk met links naar andere pagina's -->
      <ul> <!-- Een lijst van links naar andere pagina's -->
        <li><a href="index.html">WhoAmI</a></li> <!-- Link naar de indexpagina -->
        <li><a href="projecten.html">Projecten</a></li> <!-- Link naar de projectenpagina -->
        <li><a href="blog.html">Blog</a></li> <!-- Link naar de blogpagina -->
      </ul> <!-- Einde van de lijst -->
    </nav> <!-- Einde van de navigatiebalk -->
  </header> <!-- Einde van de header -->

  <main> <!-- Het hoofdgedeelte van de pagina, bevat de belangrijkste inhoud -->
    <section> <!-- Een sectie waarin alle projecten worden verzameld -->
      <h2>Mijn Projecten</h2> <!-- Hoofdkop voor het projectenoverzicht -->
      <p>Hieronder staat een overzicht van projecten waaraan ik heb gewerkt tijdens mijn studie Software Engineering.</p> <!-- Introductietekst -->

      <!-- Bedieningspaneel: Zoeken, Filteren & Sorteren -->
      <div class="controls-container">
        <div class="control-group">
          <label for="search-input">Zoeken:</label>
          <input type="text" id="search-input" placeholder="Zoek op titel of techniek....">
        </div>

        <div class="control-group">
          <label for="category-filter">Categorie:</label>
          <select id="category-filter">
            <option value="all">Alle categorieën</option>
            <option value="Web">Web Development</option>
            <option value="Database">Database</option>
            <option value="Applicatie">Applicatie</option>
          </select>
        </div>

        <div class="control-group">
          <label for="sort-select">Sorteren op:</label>
          <select id="sort-select">
            <option value="title-asc">Titel (A-Z)</option>
            <option value="title-desc">Titel (Z-A)</option>
          </select>
        </div>
      </div>

      <!-- Hier rendert JavaScript de dynamische kaarten -->
      <div id="projecten-container" class="projecten-grid"></div>
    </section>
  </main>
  

  <footer> <!-- De footer van de pagina, bevat informatie over de auteur en het jaartal -->
    <p>&copy; 2026 Ferdous Uddin</p> <!-- Een paragraaf met het copyright symbool en de naam van de auteur -->
    <a href="contact.html" class="contact-knop" aria-label="Contact opnemen"> <!-- Knop naar het contactformulier -->
      <img src="img/contactmail.png" alt=""> <!-- Envelop-icoon -->
    </a>
  </footer> <!-- Einde van de footer -->
</body> <!-- Einde van de inhoud van de pagina -->
</html> <!-- Einde van het HTML-document -->
